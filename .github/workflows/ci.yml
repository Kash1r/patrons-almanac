name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code and CSS match their sources
        run: |
          pnpm gen
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
