[project]
name = "almanac-pipeline"
version = "0.1.0"
description = "Ingest and feature jobs for Patron's Almanac"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6,<1.6",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
